[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palserver-manager"
version = "0.7.0"
description = "Unofficial cross-platform Palworld dedicated server manager with local and remote administration."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PalServer Manager contributors"}]
dependencies = [
  "requests>=2.32",
  "psutil>=6.0",
  "rich>=13.9",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
agent = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
build = ["pyinstaller>=6.11"]
dev = [
  "pytest>=8.3",
  "httpx2",
]
all = ["PySide6>=6.8", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[project.scripts]
palserver-manager = "palserver_manager.cli:main"
palserver-agent = "palserver_manager.agent:main"
palserver-gui = "palserver_manager.gui:main"

[tool.setuptools.packages.find]
include = ["palserver_manager*"]

[tool.setuptools.package-data]
palserver_manager = ["assets/*.png"]
